# Production profile (EC2 deployment). Flyway runs on startup — migrations apply
# automatically on boot (no separate migration step). Secrets and addresses come
# from the environment; the datasource and Cognito issuer have no defaults here so
# a missing value fails fast at startup instead of silently hitting localhost.
#
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Required env:   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
#                 SPRING_DATASOURCE_PASSWORD, COGNITO_ISSUER_URI,
#                 WEB_CORS_ALLOWED_ORIGINS
# Optional env:   COGNITO_JWK_SET_URI (derived from the issuer if blank — correct
#                   for real AWS Cognito), COGNITO_ADMIN_GROUP (defaults to "admin")
#
# Local/test profiles are unchanged.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

cognito:
  issuer-uri: ${COGNITO_ISSUER_URI}
  jwk-set-uri: ${COGNITO_JWK_SET_URI:}
  admin-group: ${COGNITO_ADMIN_GROUP:admin}

web:
  cors:
    allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:}
