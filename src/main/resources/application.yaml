spring:
  application:
    name: carrinho-esperto

  datasource:
    url: jdbc:postgresql://localhost:5432/carrinho_esperto
    username: carrinho_esperto
    password: carrinho_esperto
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Browser frontend CORS. Explicit origin allow-list, never '*'. Local default is
# the Vite dev server; production origins via WEB_CORS_ALLOWED_ORIGINS
# (comma-separated).
web:
  cors:
    allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OAuth2 Resource Server / Cognito. Real values are supplied per environment
# (see application-local.yaml, application-test.yaml, or COGNITO_ISSUER_URI in
# production). The default below only lets the context start; it validates nothing.
cognito:
  issuer-uri: ${COGNITO_ISSUER_URI:http://localhost:4566/pool-not-configured}
  jwk-set-uri: ${COGNITO_JWK_SET_URI:}
  admin-group: ${COGNITO_ADMIN_GROUP:admin}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
